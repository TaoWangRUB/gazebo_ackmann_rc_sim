controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    front_steering: true
    front_steering_joints:
      - ackmann/front_left_wheel_steering_joint
      - ackmann/front_right_wheel_steering_joint
    rear_wheels_joints:
      - ackmann/rear_left_wheel_joint
      - ackmann/rear_right_wheel_joint
    front_wheels_joints:
      - ackmann/front_left_wheel_joint
      - ackmann/front_right_wheel_joint
    wheel_base: 0.224
    wheel_track: 0.2
    wheel_radius: 0.035
    open_loop: false
    enable_odom_tf: true
    front_steering_joints_position_limits:
      min_position: -0.5236
      max_position: 0.5236
    linear:
      x:
        max_velocity: 2.0
        max_acceleration: 1.0
        max_jerk: 5.0
    angular:
      z:
        max_velocity: 1.0
        max_acceleration: 1.0
        max_jerk: 2.5
    cmd_vel_topic: /ackmann/cmd_vel
    odom_topic: /ackmann/odom
    tf_topic: /ackmann/tf
    odom_frame_id: ackmann/odom
    base_frame_id: ackmann/base_footprint
    publish_rate: 50.0
    publish_odom: true
    publish_odom_tf: true
    wheels_per_side: 1
    max_steering_angle: 0.5236
    joints:
      ackmann/front_left_wheel_steering_joint:
        position_pid:
          p: 10.0
          i: 0.1
          d: 0.5
          i_clamp_min: -1.0
          i_clamp_max: 1.0
          antiwindup: true
      ackmann/front_right_wheel_steering_joint:
        position_pid:
          p: 10.0
          i: 0.1
          d: 0.5
          i_clamp_min: -1.0
          i_clamp_max: 1.0
          antiwindup: true
      ackmann/rear_left_wheel_joint:
        velocity_pid:
          p: 1.0
          i: 0.01
          d: 0.1
          i_clamp_min: -0.5
          i_clamp_max: 0.5
          antiwindup: true
      ackmann/rear_right_wheel_joint:
        velocity_pid:
          p: 1.0
          i: 0.01
          d: 0.1
          i_clamp_min: -0.5
          i_clamp_max: 0.5
          antiwindup: true
      ackmann/front_left_wheel_joint:
        velocity_pid:
          p: 1.0
          i: 0.01
          d: 0.1
          i_clamp_min: -0.5
          i_clamp_max: 0.5
          antiwindup: true
      ackmann/front_right_wheel_joint:
        velocity_pid:
          p: 1.0
          i: 0.01
          d: 0.1
          i_clamp_min: -0.5
          i_clamp_max: 0.5
          antiwindup: true

joint_state_broadcaster:
  ros__parameters:
    joints:
      - ackmann/front_left_wheel_joint
      - ackmann/front_right_wheel_joint
      - ackmann/rear_left_wheel_joint
      - ackmann/rear_right_wheel_joint
      - ackmann/front_left_wheel_steering_joint
      - ackmann/front_right_wheel_steering_joint
    interfaces:
      - position
      - velocity